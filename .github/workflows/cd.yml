name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: self-hosted # ponytail: this Mac (arm64, Colima) is the build + deploy host; no separate servers

    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Registry image names must be lowercase; the GitHub owner name is not
          IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/ml-api
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "Building version ${{ steps.version.outputs.version }} as ${{ steps.version.outputs.image }}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo, so GITHUB_TOKEN can push/pull it later
      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.version.outputs.image }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.version.outputs.image }}:latest
