name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: self-hosted # ponytail: this Mac (arm64, Colima) is the build + deploy host; no separate servers

    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Registry image names must be lowercase; the GitHub owner name is not
          IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/ml-api
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "Building version ${{ steps.version.outputs.version }} as ${{ steps.version.outputs.image }}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo, so GITHUB_TOKEN can push/pull it later
      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }} \
            -t ${{ steps.version.outputs.image }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          docker push ${{ steps.version.outputs.image }}:latest

  deploy-staging:
    needs: build
    runs-on: self-hosted

    environment:
      name: staging
      url: http://localhost:5002/health

    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Promote the exact image pushed by build; never rebuild per environment
      - name: Deploy to staging
        run: |
          docker pull "$IMAGE"
          docker rm -f mlops-api-staging || true
          docker run -d \
            --name mlops-api-staging \
            --restart unless-stopped \
            -p 5002:5000 \
            "$IMAGE"

      # retry-all-errors: Colima's port forwarder resets connections while the app boots
      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 2 \
            http://localhost:5002/health

  # ponytail: private repo on this plan can't use environment "Required reviewers",
  # so approval is an issue comment. Swap for `environment: production` reviewers on Team/Enterprise or a public repo.
  approve-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest # manual-approval is a Docker action, Linux runners only
    timeout-minutes: 60

    permissions:
      issues: write

    steps:
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1.13.1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.repository_owner }}
          minimum-approvals: 1
          issue-title: "Promote ml-api ${{ needs.build.outputs.version }} to production"
          issue-body: |
            Image `${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}` passed the staging /health smoke test.
            Comment `approve` to deploy it to production, or `deny` to stop.

  deploy-production:
    needs:
      - build
      - approve-production
    runs-on: self-hosted

    environment:
      name: production
      url: http://localhost:5003/health

    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy production
        run: |
          docker pull "$IMAGE"
          docker rm -f mlops-api-production || true
          docker run -d \
            --name mlops-api-production \
            --restart unless-stopped \
            -p 5003:5000 \
            "$IMAGE"

      - name: Verify production
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 2 \
            http://localhost:5003/health
